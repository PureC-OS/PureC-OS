#
# qmake configuration for PureC OS (clang, cross, static, libc++)
#

MAKEFILE_GENERATOR      = UNIX
QMAKE_PLATFORM         += purec
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/unix.conf)
include(../common/gcc-base-unix.conf)
include(../common/clang.conf)

QMAKE_CFLAGS_THREAD    += -D_REENTRANT
QMAKE_CXXFLAGS_THREAD  += $$QMAKE_CFLAGS_THREAD

QMAKE_INCDIR            =
QMAKE_LIBDIR            =
QMAKE_INCDIR_X11        =
QMAKE_LIBDIR_X11        =
QMAKE_INCDIR_OPENGL     =
QMAKE_LIBDIR_OPENGL     =
QMAKE_INCDIR_EGL        =
QMAKE_LIBDIR_EGL        =

QMAKE_LIBS              =
QMAKE_LIBS_DYNLOAD      =
QMAKE_LIBS_THREAD       =

QMAKE_AR                = llvm-ar cqs
QMAKE_OBJCOPY           = llvm-objcopy
QMAKE_NM                = llvm-nm -P
QMAKE_RANLIB            = llvm-ranlib
QMAKE_STRIP             = llvm-strip

load(qt_config)
