name: Build and Release PureC OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y make gcc g++ nasm xorriso mtools python3 git build-essential bison flex libgmp-dev libmpc-dev libmpfr-dev texinfo

      - name: Install Limine
        run: |
          git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1
          cd limine && make
          sudo make install
          cd ..

      - name: Install x86_64-elf cross-compiler
        run: |
          wget https://ftp.gnu.org/gnu/binutils/binutils-2.42.tar.gz
          tar -xf binutils-2.42.tar.gz
          mkdir build-binutils && cd build-binutils
          ../binutils-2.42/configure --target=x86_64-elf --prefix=/usr/local --with-sysroot --disable-nls --disable-werror
          make -j$(nproc) && sudo make install
          cd ..

          wget https://ftp.gnu.org/gnu/gcc/gcc-14.1.0/gcc-14.1.0.tar.gz
          tar -xf gcc-14.1.0.tar.gz
          mkdir build-gcc && cd build-gcc
          ../gcc-14.1.0/configure --target=x86_64-elf --prefix=/usr/local --disable-nls --enable-languages=c,c++ --without-headers
          make all-gcc -j$(nproc) && sudo make install-gcc
          make all-target-libgcc -j$(nproc) && sudo make install-target-libgcc
          cd ..

      - name: Build PureC OS
        run: |
          ./build-limine.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purec-os-iso
          path: bin/purec_limine.iso
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: purec-os-iso
          path: ./bin/

      - name: Get commit hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create and upload release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ steps.vars.outputs.sha_short }}
          name: PureC OS Nightly Release ${{ steps.vars.outputs.sha_short }}
          body: |
            Automatically built release after merge to main.
            Contains fresh PureC OS ISO image.
            Commit hash: ${{ github.sha }}
          files: |
            bin/purec_limine.iso
          draft: false
          prerelease: true