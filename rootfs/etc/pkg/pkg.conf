[options]
Architecture = x86_64
SigLevel = Optional
# Prerelease = no
# API = https://api.github.com

# Trusted repositories: package name = GitHub repository.
# pkg takes the newest release and installs its asset
# <name>-<version>-x86_64.pkg.tar.gz (plus <asset>.sig when present).
[trusted]
userspace = https://github.com/PureC-OS/PureC-OS-Userspace
video-backend = https://github.com/PureC-OS/video-backend
sdl2 = https://github.com/PureC-OS/SDL
chocolate-doom = https://github.com/PureC-OS/chocolate-doom
freedoom = https://github.com/PureC-OS/freedoom
vim = https://github.com/PureC-OS/vim
wolfssl = https://github.com/PureC-OS/wolfssl
tcc = https://github.com/PureC-OS/PureC-TCC
