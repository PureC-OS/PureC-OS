[options]
Architecture = x86_64
SigLevel = Required
# The registry lists the official repositories (registry.conf in that repository).
# pkg installs only packages from the releases of those repositories.
Registry = https://github.com/PureC-OS/PureC-OS-Trusted-PKG-URL
# Prerelease = no
# API = https://api.github.com
# Number of different master keys that must sign keyring.conf (default 1).
# KeyringThreshold = 1
# Use the "community" repositories of the registry: third-party packages,
# signed by keys bound to their own repository (default no).
# AllowCommunity = no

# Your own repositories, for development: they are used only with
# AllowLocalRepos = yes (in [options]) and are shown as "local" by pkg -Si.
[trusted]
# https://github.com/OWNER/REPO
